      try {

        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {}
    </script><meta name="description" content="熙屿的文章分类。"><meta name="author" content="熙屿"><link rel="canonical" href="https://blog.struggle.work/categories/"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="alternate" type="application/rss+xml" title="watchdogexd's blog RSS" href="/index.xml"><meta property="og:site_name" content="watchdogexd's blog"><meta property="og:locale" content="zh_CN"><meta property="og:type" content="website"><meta property="og:title" content="分类 — watchdogexd's blog"><meta property="og:description" content="熙屿的文章分类。"><meta property="og:url" content="https://blog.struggle.work/categories/"><meta name="twitter:card" content="summary"><title>分类 — watchdogexd&#39;s blog</title><link rel="stylesheet" href="/_astro/BaseLayout.Cd-GlB9K.css"></head><body><a class="skip-link" href="#main">跳转到正文</a><div class="site-shell"><header class="site-header"><div class="brand"><button id="theme-toggle" class="brand-mark" type="button" aria-label="切换到暗色模式" aria-pressed="false" title="切换到暗色模式"></button><a class="brand-name" href="/" aria-label="watchdogexd's blog 首页">watchdogexd's blog</a></div><nav class="main-nav" aria-label="主导航"><a class="nav-link" href="/">首页</a><a class="nav-link" href="/archive/">归档</a><a class="nav-link active" href="/categories/" aria-current="page">分类</a><a class="nav-link" href="/tags/">标签</a><a class="nav-link" href="/search/">搜索</a></nav></header><main id="main" tabindex="-1"><header class="page-top"><h1 class="page-heading">分类</h1></header><div class="category-list"><a class="category-row" href="/categories/life/" style="--motion-index: 0"><span>生活</span><strong>1</strong></a><a class="category-row" href="/categories/tech/" style="--motion-index: 1"><span>技术</span><strong>3</strong></a><a class="category-row" href="/categories/travel/" style="--motion-index: 2"><span>旅行</span><strong>1</strong></a></div></main><footer class="site-footer"><div class="site-footer-credits"><small>Build with ❤️ by <a href="https://astro.build" rel="noopener noreferrer">Astro</a></small><a class="license-badge" rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" aria-label="CC BY-NC-SA 4.0"><span class="cc-mark" aria-hidden="true">CC</span><span>BY-NC-SA 4.0</span></a></div></footer></div><script>
      (() => {
        const root = document.documentElement;
        const button = document.querySelector("#theme-toggle");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
        let themeChangeSequence = 0;

        const currentTheme = () => root.dataset.theme || (systemTheme.matches ? "dark" : "light");

        const syncThemeControl = () => {
          const theme = currentTheme();
          const nextThemeLabel = theme === "dark" ? "切换到亮色模式" : "切换到暗色模式";
          button?.setAttribute("aria-label", nextThemeLabel);
          button?.setAttribute("aria-pressed", String(theme === "dark"));
          if (button) button.title = nextThemeLabel;

          if (root.dataset.theme) {
            const themeColorTags = document.querySelectorAll('meta[name="theme-color"]');
            const themeColorTag = themeColorTags[0];
            if (themeColorTag) {
              themeColorTag.setAttribute("content", theme === "dark" ? "#121212" : "#f7f7f8");
              themeColorTag.removeAttribute("media");
              themeColorTags.forEach((tag, index) => { if (index > 0) tag.remove(); });
            }
          }
        };

        syncThemeControl();

        button?.addEventListener("click", () => {
          const nextTheme = currentTheme() === "dark" ? "light" : "dark";
          root.classList.add("theme-change");
          const sequence = ++themeChangeSequence;
          root.dataset.theme = nextTheme;
          try {
            localStorage.setItem("watchdogexd-theme", nextTheme);
          } catch {}
          syncThemeControl();
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => {
              if (sequence === themeChangeSequence) root.classList.remove("theme-change");
            });
          });
        });

        systemTheme.addEventListener("change", () => {
          if (!root.dataset.theme) syncThemeControl();
        });
      })();
    </script></body></html>
