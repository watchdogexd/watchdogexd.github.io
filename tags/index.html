n-index: 4">#Linux<small>2</small></a><a href="/tags/macos/" style="--motion-index: 5">#macOS<small>1</small></a><a href="/tags/multi/" style="--motion-index: 6">#multi<small>1</small></a><a href="/tags/nali/" style="--motion-index: 7">#nali<small>1</small></a><a href="/tags/sing-box/" style="--motion-index: 8">#sing-box<small>1</small></a><a href="/tags/tools/" style="--motion-index: 9">#Tools<small>1</small></a><a href="/tags/tproxy/" style="--motion-index: 10">#TProxy<small>1</small></a><a href="/tags/travel/" style="--motion-index: 11">#travel<small>1</small></a><a href="/tags/udp/" style="--motion-index: 12">#UDP<small>1</small></a></div></main><footer class="site-footer"><div class="site-footer-credits"><small>Build with ❤️ by <a href="https://astro.build" rel="noopener noreferrer">Astro</a></small><a class="license-badge" rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" aria-label="CC BY-NC-SA 4.0"><span class="cc-mark" aria-hidden="true">CC</span><span>BY-NC-SA 4.0</span></a></div></footer></div><script>
      (() => {
        const root = document.documentElement;
        const button = document.querySelector("#theme-toggle");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
        let transitionTimer;

        const currentTheme = () => root.dataset.theme || (systemTheme.matches ? "dark" : "light");

        const syncThemeControl = () => {
          const theme = currentTheme();
          const nextThemeLabel = theme === "dark" ? "切换到亮色模式" : "切换到暗色模式";
          button?.setAttribute("aria-label", nextThemeLabel);
          button?.setAttribute("aria-pressed", String(theme === "dark"));
          if (button) button.title = nextThemeLabel;

          if (root.dataset.theme) {
            const themeColorTags = document.querySelectorAll('meta[name="theme-color"]');
            const themeColorTag = themeColorTags[0];
            if (themeColorTag) {
              themeColorTag.setAttribute("content", theme === "dark" ? "#121212" : "#f7f7f8");
              themeColorTag.removeAttribute("media");
              themeColorTags.forEach((tag, index) => { if (index > 0) tag.remove(); });
            }
          }
        };

        syncThemeControl();

        button?.addEventListener("click", () => {
          const nextTheme = currentTheme() === "dark" ? "light" : "dark";
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            root.classList.add("theme-transition");
            window.clearTimeout(transitionTimer);
            transitionTimer = window.setTimeout(() => root.classList.remove("theme-transition"), 280);
          }
          root.dataset.theme = nextTheme;
          try {
            localStorage.setItem("watchdogexd-theme", nextTheme);
          } catch {}
          syncThemeControl();
        });

        systemTheme.addEventListener("change", () => {
          if (!root.dataset.theme) syncThemeControl();
        });
      })();
    </script></body></html>
