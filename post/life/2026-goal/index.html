      (() => {
        const root = document.documentElement;
        const button = document.querySelector("#theme-toggle");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
        let themeChangeSequence = 0;

        const currentTheme = () => root.dataset.theme || (systemTheme.matches ? "dark" : "light");

        const syncThemeControl = () => {
          const theme = currentTheme();
          const nextThemeLabel = theme === "dark" ? "切换到亮色模式" : "切换到暗色模式";
          button?.setAttribute("aria-label", nextThemeLabel);
          button?.setAttribute("aria-pressed", String(theme === "dark"));
          if (button) button.title = nextThemeLabel;

          if (root.dataset.theme) {
            const themeColorTags = document.querySelectorAll('meta[name="theme-color"]');
            const themeColorTag = themeColorTags[0];
            if (themeColorTag) {
              themeColorTag.setAttribute("content", theme === "dark" ? "#121212" : "#f7f7f8");
              themeColorTag.removeAttribute("media");
              themeColorTags.forEach((tag, index) => { if (index > 0) tag.remove(); });
            }
          }
        };

        syncThemeControl();

        button?.addEventListener("click", () => {
          const nextTheme = currentTheme() === "dark" ? "light" : "dark";
          root.classList.add("theme-change");
          const sequence = ++themeChangeSequence;
          root.dataset.theme = nextTheme;
          try {
            localStorage.setItem("watchdogexd-theme", nextTheme);
          } catch {}
          syncThemeControl();
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => {
              if (sequence === themeChangeSequence) root.classList.remove("theme-change");
            });
          });
        });

        systemTheme.addEventListener("change", () => {
          if (!root.dataset.theme) syncThemeControl();
        });
      })();
    </script></body></html>
